<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student ID Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <div class="card-header">
            <h1>STUDENT ID CARD</h1>
            <h2>CINEC CAMPUS</h2>
        </div>

        <img class="photo"
             src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFgOd90f7IgEv8EH6ZMLc6BG1r_vpI1C3SCPRl_vmmzA&s=10"
             alt="Student Profile Picture">

        <h2 class="name">Nisal Vimukthi</h2>
        <span class="id-badge">STU001</span>

        <div class="details">
            <div class="row"><span class="label">Course</span><span class="value">Computer Science</span></div>
            <div class="row"><span class="label">Year</span><span class="value">2nd Year</span></div>
            <div class="row"><span class="label">Date of Birth</span><span class="value">16/03/2001</span></div>
            <div class="row"><span class="label">Email</span><span class="value">nisal@example.com</span></div>
            <div class="row"><span class="label">Phone</span><span class="value">0712345678</span></div>
        </div>

        <div class="subjects">
            <h3>Student Information</h3>
            <ul>
                <li>HTML</li>
                <li>C Programming</li>
                <li>Web Development</li>
            </ul>
        </div>

        <div class="card-footer">
            <div>
                <b>Valid Until</b><br>
                December 2027
            </div>
            <div class="signature">
                <div class="line"></div>
                Authorized Signature
            </div>
        </div>

    </div>

</body>
</html>
